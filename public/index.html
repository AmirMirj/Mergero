<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mergero Origination Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="banner" class="banner hidden"></div>

  <div class="layout">
    <aside class="sidebar">
      <a class="brand" href="#/dashboard">
        <div class="brand-mark">M</div>
        <div>
          <div class="brand-name">Mergero</div>
          <div class="brand-sub">Origination Engine</div>
        </div>
      </a>

      <nav class="nav">
        <a href="#/dashboard" data-nav="dashboard">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="6" height="6" rx="1.2"/><rect x="11" y="3" width="6" height="6" rx="1.2"/><rect x="3" y="11" width="6" height="6" rx="1.2"/><rect x="11" y="11" width="6" height="6" rx="1.2"/></svg>
          Dashboard
        </a>
        <a href="#/prospects" data-nav="prospects">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5h14M3 10h14M3 15h9"/></svg>
          Prospects
        </a>
        <a href="#/buyers" data-nav="buyers">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="6" width="15" height="10.5" rx="1.5"/><path d="M7 6V4.5A1.5 1.5 0 0 1 8.5 3h3A1.5 1.5 0 0 1 13 4.5V6M2.5 10.5h15"/></svg>
          Buyers
        </a>
        <a href="#" data-nav="registry" onclick="event.preventDefault(); window.MergeroRegistry && window.MergeroRegistry.open();">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="9" r="5.5"/><path d="M13.2 13.2 17 17"/></svg>
          Registry lookup
        </a>
        <a href="#/settings" data-nav="settings">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>
          Settings
        </a>
      </nav>

      <div class="sidebar-foot">
        <div class="sidebar-user" id="sidebar-user">
          <div class="avatar">T</div>
          <div>
            <div class="sidebar-user-name">Advisor</div>
            <div class="sidebar-user-sub">Mergero</div>
          </div>
        </div>
        <div class="sidebar-note">Sell-side deal origination copilot</div>
      </div>
    </aside>

    <main id="main" class="main"></main>
  </div>

  <div id="modal-root" class="modal-root hidden"></div>
  <div id="toasts" class="toasts"></div>

  <script src="/app.js"></script>
  <script src="/registry.js"></script>
</body>
</html>
