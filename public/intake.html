<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mergero · Confidential owner conversation</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* Buyer-demand snapshot shown under the thank-you state once the conversation is complete */
    .demand-snapshot { padding: 18px 20px 20px; border-top: 1px solid var(--border); background: var(--surface); }
    .demand-snapshot .ds-title { font-size: 11.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--teal-dark); font-weight: 600; margin-bottom: 10px; }
    .demand-snapshot .ds-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .demand-snapshot .ds-n { font-size: 36px; font-weight: 700; color: var(--navy); line-height: 1; font-variant-numeric: tabular-nums; }
    .demand-snapshot .ds-text { flex: 1 1 200px; font-weight: 600; color: var(--navy); line-height: 1.35; }
    .demand-snapshot .ds-types { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
    .demand-snapshot .ds-soft { margin-top: 10px; padding: 10px 12px; background: var(--teal-bg); border-left: 3px solid var(--teal); border-radius: 0 8px 8px 0; font-size: 13px; color: var(--navy); line-height: 1.5; }
    .demand-snapshot .ds-quotes { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .demand-snapshot .ds-quotes li { font-size: 12.5px; color: var(--muted); font-style: italic; padding-left: 10px; border-left: 2px solid var(--border-strong); line-height: 1.5; }
    .demand-snapshot .ds-foot { margin-top: 10px; font-size: 11.5px; color: var(--muted-2); }
  </style>
</head>
<body>
  <div class="intake-page">
    <div class="intake-card">
      <div class="intake-header">
        <div class="brand-mark">M</div>
        <div>
          <div class="title">Mergero · Confidential owner conversation</div>
          <div class="sub" id="intake-sub">Loading…</div>
        </div>
        <span class="pill" id="intake-status"></span>
      </div>

      <div class="chat" id="chat" aria-live="polite"></div>

      <div class="complete-state hidden" id="complete-state">✓ Thank you — summary sent to your advisor</div>
      <div class="demand-snapshot hidden" id="demand-snapshot" aria-live="polite"></div>

      <form class="chat-input" id="chat-form">
        <textarea id="chat-text" rows="1" placeholder="Type your answer…" autocomplete="off" required></textarea>
        <button type="submit" class="btn btn-primary" id="chat-send">Send</button>
      </form>
    </div>
    <div class="intake-foot">Private link · Your answers are shared only with your Mergero advisor. Nothing is published.</div>
  </div>

  <div id="toasts" class="toasts"></div>
  <script src="/intake.js"></script>
</body>
</html>
